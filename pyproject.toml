[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lumbar-ct"
version = "0.1.0"
description = "Reproducible L1-L5 CT segmentation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "nibabel==5.3.2", "torch==2.8.0", "torchvision==0.23.0", "nnunetv2==2.8.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
lumbar-ct = "lumbar_ct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
